name: Build NewTaraneh APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure NewTaranehApp.kt v2.5 (categories + CategorySongsScreen)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/newtaraneh/music/ui
          KT=android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          if [ -s "$KT" ] && grep -q CategorySongsScreen "$KT" && grep -q APP_CATEGORIES "$KT"; then
            echo "Using committed NewTaranehApp.kt with categories"
          else
            echo "Committed file missing feature, trying uguu fallback"
            curl -fsSL "https://h.uguu.se/nPDUyHxj.kt" -o "$KT" || true
          fi
          wc -c "$KT"
          grep -q CategorySongsScreen "$KT" || echo "WARNING: CategorySongsScreen missing"
          grep -q APP_CATEGORIES "$KT" || echo "WARNING: APP_CATEGORIES missing"
          grep -q BackHandler "$KT"

      - name: Embed brand + category covers from local base64
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
          done
          python3 - <<'PY'
          import base64, pathlib, urllib.request, sys
          root = pathlib.Path(".")
          def load_b64(path, fallback_url=None):
              p = root / path
              if p.exists() and p.stat().st_size > 100:
                  data = p.read_text().strip()
                  if "," in data:
                      data = data.split(",", 1)[1]
                  return base64.b64decode(data)
              if fallback_url:
                  data = urllib.request.urlopen(fallback_url, timeout=30).read().decode()
                  if "," in data:
                      data = data.split(",", 1)[1]
                  return base64.b64decode(data)
              raise FileNotFoundError(path)
          # Brand
          try:
              logo = load_b64("assets/brand_logo.b64", "https://d.uguu.se/EGxXQtpd.jpg")
              (root / "android/app/src/main/res/drawable/brand_logo.jpg").write_bytes(logo)
          except Exception as e:
              print("logo fail", e)
              urllib.request.urlretrieve("https://d.uguu.se/EGxXQtpd.jpg", "android/app/src/main/res/drawable/brand_logo.jpg")
          try:
              banner = load_b64("assets/brand_banner.b64", "https://n.uguu.se/ONnGRFPF.jpg")
              (root / "android/app/src/main/res/drawable/brand_banner.jpg").write_bytes(banner)
          except Exception as e:
              print("banner fail", e)
              urllib.request.urlretrieve("https://n.uguu.se/ONnGRFPF.jpg", "android/app/src/main/res/drawable/brand_banner.jpg")
          # Categories
          cats = ["bikalam", "disslove", "sonnati", "rap", "pop", "remix"]
          for c in cats:
              out = root / f"android/app/src/main/res/drawable/cat_{c}.jpg"
              try:
                  data = load_b64(f"assets/categories/cat_{c}.b64")
                  out.write_bytes(data)
                  print(f"cat_{c} ok, {len(data)} bytes")
              except Exception as e:
                  print(f"cat_{c} fail", e)
          print("brand + categories ok")
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls -la android/app/src/main/res/drawable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaraneh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
