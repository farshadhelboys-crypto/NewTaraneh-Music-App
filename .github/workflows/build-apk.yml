name: Build NewTaraneh Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full NewTaranehApp.kt (v2.6 categories + tag filter)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/newtaraneh/music/ui
          KT=android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          curl -fsSL "https://d.uguu.se/kmUtyrXR.kt" -o "$KT" \
            || curl -fsSL "https://n.uguu.se/gOkNUwrT.txt" -o "$KT"
          wc -c "$KT"
          grep -q CategorySongsScreen "$KT"
          grep -q APP_CATEGORIES "$KT"
          grep -q songMatchesCategory "$KT"
          grep -q BackHandler "$KT"
          echo "NewTaranehApp.kt OK"

      - name: Embed brand + category covers
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; done
          python3 - <<'PY'
          import base64, pathlib, urllib.request
          root = pathlib.Path(".")
          def load_b64(path, fallback_url=None):
              p = root / path
              if p.exists() and p.stat().st_size > 100:
                  data = p.read_text().strip()
                  if "," in data:
                      data = data.split(",", 1)[1]
                  return base64.b64decode(data)
              if fallback_url:
                  raw = urllib.request.urlopen(fallback_url, timeout=30).read()
                  if raw[:2] == b"\xff\xd8":
                      return raw
                  data = raw.decode()
                  if "," in data:
                      data = data.split(",", 1)[1]
                  return base64.b64decode(data)
              raise FileNotFoundError(path)
          try:
              (root / "android/app/src/main/res/drawable/brand_logo.jpg").write_bytes(
                  load_b64("assets/brand_logo.b64", "https://d.uguu.se/EGxXQtpd.jpg"))
          except Exception as e:
              print("logo", e)
              urllib.request.urlretrieve("https://d.uguu.se/EGxXQtpd.jpg",
                  "android/app/src/main/res/drawable/brand_logo.jpg")
          try:
              (root / "android/app/src/main/res/drawable/brand_banner.jpg").write_bytes(
                  load_b64("assets/brand_banner.b64", "https://n.uguu.se/ONnGRFPF.jpg"))
          except Exception as e:
              print("banner", e)
              urllib.request.urlretrieve("https://n.uguu.se/ONnGRFPF.jpg",
                  "android/app/src/main/res/drawable/brand_banner.jpg")
          for c in ["bikalam", "disslove", "sonnati", "rap", "pop", "remix"]:
              out = root / f"android/app/src/main/res/drawable/cat_{c}.jpg"
              try:
                  out.write_bytes(load_b64(f"assets/categories/cat_{c}.b64"))
                  print(f"cat_{c} ok")
              except Exception as e:
                  print(f"cat_{c} missing: {e}")
          print("drawables stage1 done")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import base64
          tiny = base64.b64decode("")
          for c in ["bikalam", "disslove", "sonnati", "rap", "pop", "remix"]:
              p = Path(f"android/app/src/main/res/drawable/cat_{c}.jpg")
              if not p.exists() or p.stat().st_size < 100:
                  p.write_bytes(tiny)
                  print(f"placeholder cat_{c}")
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls -la android/app/src/main/res/drawable/

      - name: Decode release keystore
        run: |
          set -e
          if [ -f assets/newtaraneh-release.jks.b64 ]; then
            python3 -c "import base64,pathlib; pathlib.Path('android/app/newtaraneh-release.jks').write_bytes(base64.b64decode(pathlib.Path('assets/newtaraneh-release.jks.b64').read_text().strip()))"
          fi
          test -f android/app/newtaraneh-release.jks
          ls -la android/app/newtaraneh-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: "NewTaraneh2026Secure!"
          KEY_ALIAS: "newtaraneh"
          KEY_PASSWORD: "NewTaraneh2026Secure!"
        run: |
          gradle assembleRelease --no-daemon --stacktrace --console=plain
          ls -lh app/build/outputs/apk/release/

      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|SF|MF)" || true
          echo "RELEASE APK READY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaraneh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
