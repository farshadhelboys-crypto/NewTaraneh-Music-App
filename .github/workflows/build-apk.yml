name: Build NewTaraneh APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NewTaranehApp.kt v2.3 (BackHandler + stats)
        run: |
          set -e
          curl -fsSL "https://d.uguu.se/DVGxSQjk.kt" -o android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          wc -c android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          grep -q canNavigateBack android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          grep -q baseStats android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          grep -q brand_logo android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt

      - name: Embed brand images (local base64 first, uguu fallback)
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; done
          python3 - <<'PY'
          import base64, pathlib, urllib.request, sys
          root = pathlib.Path(".")
          drawable = root / "android/app/src/main/res/drawable"
          def write_jpg(name, b64_path, urls):
              out = drawable / name
              try:
                  data = (root / b64_path).read_text().strip()
                  if "," in data: data = data.split(",", 1)[1]
                  raw = base64.b64decode(data)
                  if len(raw) > 2000 and raw[:3] == b"\xff\xd8\xff":
                      out.write_bytes(raw)
                      print(name, "from local b64", len(raw))
                      return
              except Exception as e:
                  print("local fail", e)
              for u in urls:
                  try:
                      raw = urllib.request.urlopen(u, timeout=30).read()
                      if raw[:3] == b"\xff\xd8\xff":
                          out.write_bytes(raw)
                          print(name, "from", u, len(raw))
                          return
                  except Exception as e:
                      print("url fail", u, e)
              print("FAILED", name); sys.exit(1)
          write_jpg("brand_logo.jpg", "assets/brand_logo.b64",
                    ["https://d.uguu.se/EGxXQtpd.jpg"])
          write_jpg("brand_banner.jpg", "assets/brand_banner.b64",
                    ["https://n.uguu.se/ONnGRFPF.jpg"])
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls -la android/app/src/main/res/drawable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaraneh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
