name: Build NewTaraneh APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NewTaranehApp.kt v2.0
        run: |
          set -e
          curl -fsSL "https://h.uguu.se/ZrKdoaOy.kt" -o android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          wc -c android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          grep -q PlayerHolder android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt

      - name: Circular launcher icons
        run: |
          set -e
          ICON_URL="https://d.uguu.se/RFmOWovL.png"
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$dens; done
          curl -fsSL "$ICON_URL" -o /tmp/brand_icon.png
          convert /tmp/brand_icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/brand_icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/brand_icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/brand_icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/brand_icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaraneh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
