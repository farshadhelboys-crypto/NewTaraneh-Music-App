name: Build NewTaraneh APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "No gradlew found - will try to generate"
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper missing. Please open the project once in Android Studio to generate gradlew."
            exit 0
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewTaraneh-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
