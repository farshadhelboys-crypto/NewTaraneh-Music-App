name: Build NewTaraneh Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full NewTaranehApp.kt (v2.6 categories + tag filter)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/newtaraneh/music/ui
          KT=android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          curl -fsSL "https://d.uguu.se/kmUtyrXR.kt" -o "$KT" \
            || curl -fsSL "https://n.uguu.se/gOkNUwrT.txt" -o "$KT"
          wc -c "$KT"
          grep -q CategorySongsScreen "$KT"
          grep -q APP_CATEGORIES "$KT"
          grep -q songMatchesCategory "$KT"
          echo "NewTaranehApp.kt OK"

      - name: Embed REAL brand + category images (3D remix cover)
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; done
          python3 - <<'PY'
          import base64, pathlib, urllib.request, sys
          root = pathlib.Path(".")
          def pad_b64(s):
              s = s.strip()
              if "," in s: s = s.split(",",1)[1]
              s += "=" * ((-len(s)) % 4)
              return s
          def from_b64_file(path):
              p = root / path
              if not p.exists() or p.stat().st_size < 100:
                  return None
              try:
                  raw = base64.b64decode(pad_b64(p.read_text()))
                  return raw if raw[:2] == b"\xff\xd8" and len(raw) > 500 else None
              except Exception:
                  return None
          def from_url(url):
              try:
                  raw = urllib.request.urlopen(url, timeout=45).read()
                  return raw if raw[:2] == b"\xff\xd8" and len(raw) > 500 else None
              except Exception as e:
                  print("url fail", url, e)
                  return None
          def write(name, sources):
              out = root / f"android/app/src/main/res/drawable/{name}"
              for src in sources:
                  if src and len(src) > 500:
                      out.write_bytes(src)
                      print(name, "OK", len(src), "bytes")
                      return True
              print(name, "FAILED all sources")
              sys.exit(1)
          write("brand_logo.jpg", [
              from_b64_file("assets/brand_logo.b64"),
              from_url("https://h.uguu.se/tVfBUmmJ.jpg"),
          ])
          write("brand_banner.jpg", [
              from_b64_file("assets/brand_banner.b64"),
              from_url("https://n.uguu.se/piaXGSiU.jpg"),
          ])
          cats = {
              "bikalam": "https://d.uguu.se/tzCKDdPu.jpg",
              "disslove": "https://n.uguu.se/tevwfHin.jpg",
              "sonnati": "https://d.uguu.se/aklTpLxp.jpg",
              "rap": "https://h.uguu.se/rUKWwSqQ.jpg",
              "pop": "https://n.uguu.se/QPhGrQdg.jpg",
              "remix": "https://n.uguu.se/ytPcLygh.jpg",
          }
          for c, url in cats.items():
              write(f"cat_{c}.jpg", [
                  from_b64_file(f"assets/categories/cat_{c}.b64"),
                  from_url(url),
              ])
          print("ALL drawables embedded with real images")
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          ls -la android/app/src/main/res/drawable/
          for f in android/app/src/main/res/drawable/*.jpg; do
            sz=$(wc -c < "$f")
            echo "$f $sz"
            if [ "$sz" -lt 500 ]; then echo "TOO SMALL $f"; exit 1; fi
          done

      - name: Decode release keystore
        run: |
          set -e
          if [ -f assets/newtaraneh-release.jks.b64 ]; then
            python3 -c "import base64,pathlib; d=pathlib.Path('assets/newtaraneh-release.jks.b64').read_text().strip(); d+='='*((-len(d))%4); pathlib.Path('android/app/newtaraneh-release.jks').write_bytes(base64.b64decode(d))"
          fi
          test -f android/app/newtaraneh-release.jks
          ls -la android/app/newtaraneh-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: "NewTaraneh2026Secure!"
          KEY_ALIAS: "newtaraneh"
          KEY_PASSWORD: "NewTaraneh2026Secure!"
        run: |
          gradle assembleRelease --no-daemon --stacktrace --console=plain
          ls -lh app/build/outputs/apk/release/

      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|SF|MF)" || true
          echo "RELEASE APK READY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaraneh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
