name: Build NewTaraneh Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full NewTaranehApp.kt (v2.6 categories + tag filter)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/newtaraneh/music/ui
          KT=android/app/src/main/java/com/newtaraneh/music/ui/NewTaranehApp.kt
          curl -fsSL "https://d.uguu.se/kmUtyrXR.kt" -o "$KT" \
            || curl -fsSL "https://n.uguu.se/gOkNUwrT.txt" -o "$KT"
          wc -c "$KT"
          grep -q CategorySongsScreen "$KT"
          grep -q APP_CATEGORIES "$KT"
          grep -q songMatchesCategory "$KT"
          grep -q BackHandler "$KT"
          echo "NewTaranehApp.kt OK"

      - name: Embed brand + category covers
        run: |
          mkdir -p android/app/src/main/res/drawable
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p android/app/src/main/res/mipmap-$d; done
          python3 - <<'PY'
          import base64, pathlib, urllib.request, binascii
          root = pathlib.Path(".")
          # Valid minimal JPEG
          TINY = base64.b64decode(
              "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/"
              "2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/"
              "wAARCAABAAEDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAn/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/8QAFQEBAQAAAAAAAAAAAAAAAAAAAAX/"
              "xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwCwAA8A/9k="
          )
          def try_b64(path):
              p = root / path
              if not p.exists() or p.stat().st_size < 50:
                  return None
              data = p.read_text().strip()
              if "," in data:
                  data = data.split(",", 1)[1]
              # pad
              pad = (-len(data)) % 4
              if pad:
                  data += "=" * pad
              try:
                  raw = base64.b64decode(data)
                  if len(raw) > 50:
                      return raw
              except Exception:
                  return None
              return None
          def try_url(url):
              try:
                  raw = urllib.request.urlopen(url, timeout=20).read()
                  if raw[:2] == b"\xff\xd8" and len(raw) > 100:
                      return raw
              except Exception as e:
                  print("url fail", url, e)
              return None
          def write_img(name, candidates):
              out = root / f"android/app/src/main/res/drawable/{name}"
              for src in candidates:
                  if src is None:
                      continue
                  if isinstance(src, bytes) and len(src) > 50:
                      out.write_bytes(src)
                      print(name, "ok", len(src))
                      return
              out.write_bytes(TINY)
              print(name, "placeholder")
          write_img("brand_logo.jpg", [
              try_b64("assets/brand_logo.b64"),
              try_url("https://d.uguu.se/EGxXQtpd.jpg"),
          ])
          write_img("brand_banner.jpg", [
              try_b64("assets/brand_banner.b64"),
              try_url("https://n.uguu.se/ONnGRFPF.jpg"),
          ])
          for c in ["bikalam", "disslove", "sonnati", "rap", "pop", "remix"]:
              write_img(f"cat_{c}.jpg", [try_b64(f"assets/categories/cat_{c}.b64")])
          print("drawables ready")
          PY
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          convert android/app/src/main/res/drawable/brand_logo.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          # ensure launcher icons exist
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            f=android/app/src/main/res/mipmap-$d/ic_launcher.png
            if [ ! -f "$f" ]; then
              convert -size 48x48 xc:'#00E5FF' "$f" || python3 -c "open('$f','wb').write(b'')"
            fi
          done
          ls -la android/app/src/main/res/drawable/

      - name: Decode release keystore
        run: |
          set -e
          if [ -f assets/newtaraneh-release.jks.b64 ]; then
            python3 -c "import base64,pathlib; p=pathlib.Path('assets/newtaraneh-release.jks.b64'); d=p.read_text().strip(); pad=(-len(d))%4; d+='='*pad; pathlib.Path('android/app/newtaraneh-release.jks').write_bytes(base64.b64decode(d))"
          fi
          test -f android/app/newtaraneh-release.jks
          ls -la android/app/newtaraneh-release.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: "NewTaraneh2026Secure!"
          KEY_ALIAS: "newtaraneh"
          KEY_PASSWORD: "NewTaraneh2026Secure!"
        run: |
          gradle assembleRelease --no-daemon --stacktrace --console=plain
          ls -lh app/build/outputs/apk/release/

      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|SF|MF)" || true
          echo "RELEASE APK READY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NewTaraneh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
